<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Fitness Coach</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171e26;
      --panel-2: #1e2732;
      --line: #2a3542;
      --text: #e8eef5;
      --muted: #8d9bab;
      --accent: #42d392;
      --accent-2: #2fa873;
      --user: #2563eb;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #17302a 0, var(--bg) 38%);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }
    .app { display: grid; grid-template-columns: 250px 1fr; height: 100vh; }
    aside {
      border-right: 1px solid var(--line);
      background: rgba(16, 22, 29, .72);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
    .brand span { color: var(--accent); }
    .new-chat {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
    }
    .new-chat:hover { border-color: var(--accent); }
    .clear-chat {
      border: 1px solid rgba(248, 113, 113, .28);
      background: rgba(248, 113, 113, .06);
      color: #fca5a5;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
    }
    .clear-chat:hover:not(:disabled) {
      border-color: var(--danger);
      background: rgba(248, 113, 113, .12);
    }
    .clear-chat:disabled { opacity: .5; cursor: not-allowed; }
    .session-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .session {
      padding: 9px 10px;
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }
    .session:hover, .session.active { background: var(--panel); color: var(--text); }
    .session.active { border-color: var(--line); }
    main { display: flex; flex-direction: column; min-width: 0; }
    header {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 20, 25, .72);
      backdrop-filter: blur(8px);
    }
    .header-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .status.ok .status-dot { background: var(--accent); box-shadow: 0 0 8px rgba(66, 211, 146, .6); }
    .status.bad .status-dot { background: var(--danger); }
    .banner {
      display: none;
      margin: 16px 10% 0;
      padding: 12px 14px;
      border: 1px solid rgba(248, 113, 113, .35);
      background: rgba(248, 113, 113, .08);
      color: #fecaca;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
    }
    .banner.show { display: block; }
    .badge {
      font-size: 12px;
      color: var(--accent);
      background: rgba(66, 211, 146, .1);
      border: 1px solid rgba(66, 211, 146, .28);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .chat { flex: 1; overflow-y: auto; padding: 28px 10%; }
    .welcome { max-width: 720px; margin: 6vh auto 0; text-align: center; }
    .welcome h2 { font-size: 30px; margin: 0 0 10px; }
    .welcome p { color: var(--muted); line-height: 1.7; margin: 0 0 24px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .suggestion {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .suggestion:hover { border-color: var(--accent); color: var(--accent); }
    .message { max-width: 820px; margin: 0 auto 22px; display: flex; gap: 12px; }
    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--panel-2);
      font-size: 16px;
    }
    .message.user .avatar { background: var(--user); }
    .bubble { min-width: 0; flex: 1; }
    .role { color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .content { white-space: pre-wrap; line-height: 1.72; font-size: 14.5px; overflow-wrap: anywhere; }
    .tool {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 4px 6px 4px 0;
      font-size: 12px;
      color: var(--accent);
      border: 1px solid rgba(66, 211, 146, .24);
      background: rgba(66, 211, 146, .07);
      border-radius: 7px;
      padding: 4px 8px;
    }
    .tool::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .error { color: var(--danger); white-space: pre-wrap; }
    .composer { padding: 14px 10% 22px; }
    .composer-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
    }
    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      max-height: 130px;
      min-height: 26px;
      padding: 5px 4px;
    }
    button.send {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: var(--accent-2);
      color: #04120b;
      font-weight: 800;
      cursor: pointer;
      align-self: flex-end;
    }
    button.send:disabled { opacity: .45; cursor: not-allowed; }
    .hint { max-width: 820px; margin: 8px auto 0; color: var(--muted); font-size: 11px; text-align: center; }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      aside { display: none; }
      .chat, .composer { padding-left: 16px; padding-right: 16px; }
      .welcome h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">AI <span>Fitness</span> Coach</div>
      <button class="new-chat" id="newChat">+ 新建对话</button>
      <button class="clear-chat" id="clearSessions" type="button">清空历史会话</button>
      <div class="session-list" id="sessionList"></div>
    </aside>
    <main>
      <header>
        <div class="header-left">
          <h1>健身教练智能体</h1>
          <div class="status" id="status"><span class="status-dot"></span><span id="statusText">检查服务中…</span></div>
        </div>
        <span class="badge" id="modelBadge">LangGraph Agent</span>
      </header>
      <div class="banner" id="banner"></div>
      <section class="chat" id="chat"></section>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="input" rows="1" placeholder="告诉我你的身高体重、目标和训练条件…"></textarea>
          <button class="send" id="send" aria-label="发送">↑</button>
        </div>
        <div class="hint">AI 建议仅供参考，如有伤病或健康问题请咨询医生。</div>
      </div>
    </main>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clearSessions");
    const sessionList = document.getElementById("sessionList");
    const modelBadge = document.getElementById("modelBadge");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const banner = document.getElementById("banner");
    let sessionId = localStorage.getItem("fitness_session");
    let busy = false;

    const suggestions = [
      "我 25 岁，男性，175cm，80kg，想减脂，给我一份饮食计划",
      "帮我算一下 BMI 和每日热量",
      "我是新手，每周练 3 天怎么安排",
      "帮我看看天津明天适不适合户外跑",
      "下周三晚上可不可以户外跑",
      "深蹲膝盖疼怎么办？"
    ];

    function setStatus(ok, text) {
      statusEl.classList.toggle("ok", ok);
      statusEl.classList.toggle("bad", !ok);
      statusText.textContent = text;
    }

    function showBanner(text) {
      banner.textContent = text;
      banner.classList.add("show");
    }

    function hideBanner() {
      banner.classList.remove("show");
    }

    async function init() {
      if (location.protocol === "file:") {
        setStatus(false, "请通过 HTTP 打开");
        showBanner("你正在直接打开 HTML 文件。请先启动后端：cd D:\\python\\lianxi\\fitness_coach，然后运行 ..\\.venv\\Scripts\\python.exe -m uvicorn app.web.server:app --reload --port 8000，最后访问 http://127.0.0.1:8000。");
        renderWelcome();
        return;
      }
      try {
        const res = await fetch("/api/health");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const health = await res.json();
        modelBadge.textContent = health.model === "unset" ? "LangGraph Agent" : health.model;
        setStatus(true, "后端已连接");
        if (health.agent_error) {
          showBanner(`Agent 或 MCP 工具初始化失败：${health.agent_error}`);
        } else if (!health.configured) {
          showBanner("后端已启动，但 .env 缺少模型配置。请检查 MODEL、DEEPSEEK_BASE_URL、DEEPSEEK_API_KEY。");
        }
      } catch (err) {
        setStatus(false, "后端未连接");
        showBanner(`无法连接后端（${err.message}）。请确认 uvicorn 已启动，并且访问的是 http://127.0.0.1:8000，而不是直接打开 index.html。`);
        renderWelcome();
        return;
      }
      renderWelcome();
      await loadSessions();
      if (sessionId) await loadSession(sessionId);
    }

    function renderWelcome() {
      if (chat.querySelector(".message")) return;
      chat.innerHTML = `
        <div class="welcome">
          <h2>今天练什么？</h2>
          <p>我会根据你的身体数据、目标和训练条件，生成可执行的饮食与训练计划，并记住你的对话上下文。</p>
          <div class="suggestions">
            ${suggestions.map(text => `<button class="suggestion">${text}</button>`).join("")}
          </div>
        </div>`;
      chat.querySelectorAll(".suggestion").forEach(btn => {
        btn.addEventListener("click", () => {
          input.value = btn.textContent;
          send();
        });
      });
    }

    async function loadSessions() {
      try {
        const res = await fetch("/api/sessions");
        const data = await res.json();
        sessionList.innerHTML = "";
        (data.sessions || []).forEach(session => {
          const el = document.createElement("div");
          el.className = "session" + (session.id === sessionId ? " active" : "");
          el.textContent = session.title || "新对话";
          el.title = session.title || "新对话";
          el.addEventListener("click", () => loadSession(session.id));
          sessionList.appendChild(el);
        });
      } catch (_) {}
    }

    async function loadSession(id) {
      const res = await fetch(`/api/sessions/${encodeURIComponent(id)}`);
      if (!res.ok) {
        sessionId = null;
        localStorage.removeItem("fitness_session");
        return;
      }
      const data = await res.json();
      sessionId = id;
      localStorage.setItem("fitness_session", id);
      chat.innerHTML = "";
      data.messages.forEach(msg => addMessage(msg.role === "user" ? "user" : "assistant", msg.content));
      if (!data.messages.length) renderWelcome();
      await loadSessions();
      scrollBottom();
    }

    function addMessage(role, text = "", options = {}) {
      chat.querySelector(".welcome")?.remove();
      const wrap = document.createElement("div");
      wrap.className = `message ${role}`;
      wrap.innerHTML = `
        <div class="avatar">${role === "user" ? "我" : "🏋️"}</div>
        <div class="bubble">
          <div class="role">${role === "user" ? "你" : "教练"}</div>
          <div class="tools"></div>
          <div class="content"></div>
        </div>`;
      wrap.querySelector(".content").textContent = text;
      chat.appendChild(wrap);
      scrollBottom();
      return wrap;
    }

    function addTool(wrap, name, args) {
      const tools = wrap.querySelector(".tools");
      const chip = document.createElement("span");
      chip.className = "tool";
      chip.textContent = `调用 ${name}`;
      chip.title = JSON.stringify(args || {});
      tools.appendChild(chip);
    }

    function scrollBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function parseEventBlock(block) {
      let event = "message";
      let data = "";
      block.split("\n").forEach(line => {
        if (line.startsWith("event: ")) event = line.slice(7);
        if (line.startsWith("data: ")) data += line.slice(6);
      });
      if (!data) return null;
      try { return { event, data: JSON.parse(data) }; } catch (_) { return null; }
    }

    async function send() {
      const text = input.value.trim();
      if (!text || busy) return;
      busy = true;
      sendBtn.disabled = true;
      clearBtn.disabled = true;
      input.value = "";
      input.style.height = "auto";
      addMessage("user", text);
      const coach = addMessage("assistant", "");
      const content = coach.querySelector(".content");
      const tools = coach.querySelector(".tools");
      let answer = "";
      let receivedMeta = false;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId })
        });
        if (!res.ok) {
          const detail = await res.json().catch(() => ({}));
          throw new Error(detail.detail || `HTTP ${res.status}`);
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const blocks = buffer.split("\n\n");
          buffer = blocks.pop();
          for (const block of blocks) {
            const parsed = parseEventBlock(block);
            if (!parsed) continue;
            const { event, data } = parsed;
            if (event === "meta") {
              sessionId = data.session_id;
              localStorage.setItem("fitness_session", sessionId);
              receivedMeta = true;
            } else if (event === "token") {
              answer += data.text;
              content.textContent = answer;
              scrollBottom();
            } else if (event === "tool_call") {
              addTool(coach, data.name, data.args);
            } else if (event === "tool_result") {
              tools.lastElementChild?.classList.add("done");
            } else if (event === "done") {
              if (data.answer && !answer) content.textContent = data.answer;
              setStatus(true, "后端已连接");
              hideBanner();
            } else if (event === "error") {
              content.classList.add("error");
              content.textContent = `模型调用失败：${data.message}`;
              if (data.hint) showBanner(data.hint);
              setStatus(false, "模型调用失败");
            }
          }
        }
        if (!receivedMeta) throw new Error("连接未返回会话信息");
      } catch (err) {
        content.classList.add("error");
        const networkError = err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(err.message);
        if (networkError) {
          content.textContent = "无法连接后端，请确认 uvicorn 已启动，并通过 http://127.0.0.1:8000 访问。";
          setStatus(false, "后端未连接");
          showBanner("连接不到 /api/chat。请先启动 uvicorn，再刷新页面；不要直接双击 index.html。");
        } else {
          content.textContent = `出错了：${err.message}`;
        }
      } finally {
        busy = false;
        sendBtn.disabled = false;
        clearBtn.disabled = false;
        await loadSessions();
        scrollBottom();
        input.focus();
      }
    }

    document.getElementById("newChat").addEventListener("click", () => {
      sessionId = null;
      localStorage.removeItem("fitness_session");
      chat.innerHTML = "";
      renderWelcome();
      loadSessions();
      input.focus();
    });

    clearBtn.addEventListener("click", async () => {
      if (busy) {
        showBanner("正在生成回复，请等待完成后再清空历史。");
        return;
      }
      const count = sessionList.children.length;
      const prompt = count
        ? `确定清空全部 ${count} 个历史会话吗？此操作不可恢复。`
        : "确定清空全部历史会话吗？此操作不可恢复。";
      if (!window.confirm(prompt)) return;

      busy = true;
      sendBtn.disabled = true;
      clearBtn.disabled = true;
      clearBtn.textContent = "清空中…";
      try {
        const res = await fetch("/api/sessions", { method: "DELETE" });
        if (!res.ok) {
          const detail = await res.json().catch(() => ({}));
          throw new Error(detail.detail || `HTTP ${res.status}`);
        }
        sessionId = null;
        localStorage.removeItem("fitness_session");
        chat.innerHTML = "";
        renderWelcome();
        await loadSessions();
        hideBanner();
        input.focus();
      } catch (err) {
        const networkError = err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(err.message);
        showBanner(networkError
          ? "清空失败：无法连接后端，请确认 uvicorn 正在运行。"
          : `清空失败：${err.message}`);
      } finally {
        busy = false;
        sendBtn.disabled = false;
        clearBtn.disabled = false;
        clearBtn.textContent = "清空历史会话";
      }
    });

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 130) + "px";
    });

    init();
  </script>
</body>
</html>
