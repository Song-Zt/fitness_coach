[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["data", ".tmp", "pytest_tmp", "pytest-cache-files-*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", ".tmp", "pytest_tmp", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
